<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habits">
<title>Habits</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="../shared/theme.css">
<style>
  /* Loop Habit Tracker's look: pure black, no boxes, color only where it means something. */
  :root { --bg: #000; --surface: #121212; --surface-2: #1c1c1c; --subtle: #262626; --border: #1f1f1f; --border-2: #2e2e2e;
          --text: #ececec; --soft: #9e9e9e; --muted-2: #6e6e6e; --muted: #474747; --accent: #64b5f6;
          --yes: #64b5f6; --auto: #1d3346; --partial: #b58a2c; }
  html { height: 100%; }
  body { min-height: 100%; font-size: 15px; line-height: 1.45; background: var(--bg); }
  main { max-width: 760px; margin: 0 auto; padding: 0 16px 80px; }
  a { color: var(--accent); }
  h2 { font-size: 12px; margin: 28px 0 10px; color: var(--muted-2); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .muted { color: var(--soft); font-size: 13px; }
  [hidden] { display: none !important; }

  /* top bar (sticky, with the day labels on Home) */
  .bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: env(safe-area-inset-top); }
  .bar-row { display: flex; align-items: center; gap: 2px; height: 64px; }
  .bar-row h1 { flex: 1; min-width: 0; font-size: 24px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ib { position: relative; width: 44px; height: 44px; flex: none; display: inline-flex; align-items: center; justify-content: center;
        border: 0; border-radius: 50%; background: none; color: var(--text); cursor: pointer; text-decoration: none; }
  .ib:hover { background: var(--surface-2); }
  .ib svg { width: 24px; height: 24px; }
  .ib .badge { position: absolute; top: 9px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .ib:first-child { margin-left: -12px; }

  /* Home */
  .hrow { display: grid; grid-template-columns: minmax(0, 1fr) repeat(var(--n), var(--col)); align-items: center; }
  .days { padding: 2px 0 8px; }
  .days > div { text-align: center; font-size: 12px; font-weight: 600; color: var(--soft); line-height: 1.4; letter-spacing: .02em; }
  .days b { display: block; font-weight: 500; }
  .habit { min-height: 60px; }
  .ghead { display: flex; align-items: center; gap: 8px; width: 100%; margin: 14px 0 2px; padding: 8px 0; border: 0;
           border-top: 1px solid var(--border-2); background: none; color: var(--soft); font: 600 12px var(--sans);
           letter-spacing: .08em; text-transform: uppercase; text-align: left; cursor: pointer; }
  .ghead .gn { flex: 1; }
  .ghead .gc { font-weight: 500; letter-spacing: 0; color: var(--muted-2); }
  .ghead svg { width: 18px; height: 18px; transition: transform .15s; }
  .ghead.closed svg { transform: rotate(-90deg); }
  .hname { display: flex; align-items: center; gap: 14px; min-width: 0; padding-right: 8px; text-decoration: none; }
  .hname span { font-size: 17px; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .habit.archived .hname { opacity: .45; }
  .ring { flex: none; width: 22px; height: 22px; }
  .mark { position: relative; height: 52px; display: flex; align-items: center; justify-content: center; color: var(--muted);
          font: 600 16px/1 var(--sans); cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
          touch-action: manipulation; }
  .mark svg { width: 22px; height: 22px; }
  .mark.no { color: var(--muted-2); }
  .mark .nd { position: absolute; top: 12px; right: 7px; width: 4px; height: 4px; border-radius: 50%; background: var(--soft); }
  .day:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: 8px; }
  .empty { text-align: center; padding: 48px 14px; color: var(--soft); }

  /* buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 13px; border: 1px solid var(--border-2);
         border-radius: 9px; background: var(--surface-2); color: var(--text); font: inherit; font-size: 14px; text-decoration: none; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
  .btn.danger { color: var(--red); }
  .btn:disabled { opacity: .4; cursor: default; }
  .tb { border: 0; background: none; color: var(--text); font: 600 14px var(--sans); letter-spacing: .05em; padding: 10px 14px; cursor: pointer; border-radius: 8px; }
  .tb:hover { background: var(--surface-2); }
  .tb.accent { color: var(--accent); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }

  /* habit page */
  .sub { color: var(--soft); font-size: 14px; margin: -6px 0 6px; }
  .sec { display: flex; align-items: center; justify-content: space-between; margin: 30px 0 12px; }
  .sec h2 { margin: 0; font-size: 19px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--hc); }
  .sel { width: auto; border: 0; background: none; color: var(--soft); font-size: 15px; padding: 4px 2px; cursor: pointer; }
  .overview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .overview b { display: block; font-size: 22px; font-weight: 600; color: var(--hc); font-variant-numeric: tabular-nums; }
  .overview span { font-size: 12px; color: var(--soft); }
  .chart { position: relative; }
  .hscroll { overflow-x: auto; scrollbar-width: none; }
  .hscroll::-webkit-scrollbar { display: none; }
  .hscroll svg { display: block; }
  .ylab { position: absolute; left: 0; font-size: 12px; color: var(--soft); background: var(--bg); padding-right: 6px; pointer-events: none; }
  .calwrap { display: flex; gap: 6px; }
  .calwrap .hscroll { flex: 1; min-width: 0; }
  .cal { display: grid; grid-auto-flow: column; grid-template-rows: 22px repeat(7, var(--cq)); grid-auto-columns: var(--cq); gap: 4px; --cq: 38px; }
  .cal .ml { font-size: 13px; color: var(--soft); white-space: nowrap; overflow: visible; }
  .cq { position: relative; border-radius: 3px; background: #262626; color: #9e9e9e; font-size: 14px; display: flex; align-items: center;
        justify-content: center; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer; }
  .cq.yes, .cq.auto, .cq.partial { color: rgba(0,0,0,.72); }
  .cq.skip { background: #1a1a1a; color: var(--muted-2); }
  .cq.future { visibility: hidden; }
  .cq.today { box-shadow: inset 0 0 0 2px var(--text); }
  .cq .nd { position: absolute; top: 3px; right: 3px; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
  .wdays { display: grid; grid-template-rows: 22px repeat(7, var(--cq)); gap: 4px; --cq: 38px; font-size: 13px; color: var(--soft); }
  .wdays div { display: flex; align-items: center; }
  .cal-edit { display: flex; justify-content: center; margin-top: 10px; }
  .cal-edit .tb.on { color: var(--hc); }
  .streaks > div { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; color: var(--soft); }
  .streaks > div span:last-child { text-align: right; }
  .streaks .sb { height: 22px; border-radius: 3px; background: var(--hc); color: rgba(0,0,0,.75); font-weight: 600; font-size: 12px;
                 display: flex; align-items: center; justify-content: center; min-width: 26px; margin: 0 auto; }
  .notes > div { display: grid; grid-template-columns: 64px 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); }
  .notes .d { color: var(--soft); font-size: 13px; font-variant-numeric: tabular-nums; }
  .popmenu { position: fixed; z-index: 20; min-width: 180px; background: var(--surface-2); border-radius: 8px; padding: 6px 0; box-shadow: 0 8px 24px rgba(0,0,0,.6); }
  .popmenu button { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--text); font: inherit; font-size: 15px; padding: 11px 16px; cursor: pointer; }
  .popmenu button:hover { background: var(--subtle); }
  .popmenu button.danger { color: var(--red); }
  .popmenu button.on::after { content: ' ✓'; color: var(--accent); }
  .popmenu hr { border: 0; border-top: 1px solid var(--border-2); margin: 6px 0; }
  .popmenu .ph { padding: 8px 16px 4px; font-size: 12px; color: var(--muted-2); text-transform: uppercase; letter-spacing: .06em; }

  /* forms */
  form.stack label { display: block; margin: 14px 0 5px; font-size: 13px; color: var(--soft); }
  input, select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--border-2); border-radius: 9px;
         background: var(--surface-2); color: var(--text); font: inherit; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; min-width: 0; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatches label { margin: 0 !important; }
  .swatches input { display: none; }
  .swatches span { display: block; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .swatches input:checked + span { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }

  /* dialogs */
  dialog { margin: auto; border: 0; border-radius: 16px; background: var(--surface-2); color: var(--text);
           width: min(360px, calc(100% - 32px)); padding: 18px 18px 10px; }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  .dlg-head b { display: block; font-size: 18px; font-weight: 600; color: var(--hc, var(--text)); }
  .tick { display: flex; gap: 10px; margin: 16px 0 14px; }
  .big { flex: 1; height: 52px; border-radius: 12px; border: 1px solid var(--border-2); background: transparent; color: var(--soft);
         display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .big svg { width: 24px; height: 24px; }
  .big[aria-pressed=true] { background: var(--hc, var(--accent)); border-color: var(--hc, var(--accent)); color: #000; }
  .big[data-v=no][aria-pressed=true] { background: var(--muted-2); border-color: var(--muted-2); }
  .big[data-v=skip][aria-pressed=true] { background: var(--border-2); border-color: var(--border-2); color: var(--text); }
  dialog textarea { background: var(--surface); }
  .actions { display: flex; justify-content: flex-end; gap: 4px; margin-top: 8px; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--text); font: inherit;
                 font-size: 15px; padding: 12px 4px; border-bottom: 1px solid var(--border-2); cursor: pointer; }
  .menu button:last-child { border-bottom: 0; }
  .menu button.danger { color: var(--red); }

  /* measurable-habit popup, Loop style: notes on top, number + SAVE below */
  #num-pop { position: fixed; inset: auto; top: 30vh; left: 50%; transform: translateX(-50%); margin: 0; padding: 0;
             width: min(300px, calc(100% - 32px)); border: 1px solid #555; border-radius: 6px; background: #000; overflow: hidden; }
  #num-pop textarea { display: block; border: 0; border-radius: 0; background: none; text-align: center; min-height: 84px; resize: none; padding: 26px 12px 10px; }
  .np-row { display: flex; border-top: 1px solid #555; }
  .np-row input { flex: 1; min-width: 0; border: 0; border-right: 1px solid #555; border-radius: 0; background: none;
                  text-align: center; font-size: 20px; padding: 14px 8px; }
  .np-row input::-webkit-outer-spin-button, .np-row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .np-row input { -moz-appearance: textfield; appearance: textfield; }
  .np-row button { border: 0; background: none; color: var(--text); font: 600 15px var(--sans); letter-spacing: .05em; padding: 0 22px; cursor: pointer; }
  .np-unit { padding: 0 0 8px; text-align: center; font-size: 12px; color: var(--soft); }

  /* journal page */
  .journal textarea { min-height: 180px; border: 0; background: none; padding: 4px 0; font-size: 17px; line-height: 1.5; resize: none; overflow: hidden; }
  .journal textarea:focus { border: 0; }
  .journal .jbar { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--border-2); }
  .journal .jbar .spacer { flex: 1; }
  .journal input[type=date] { width: auto; padding: 5px 8px; font-size: 13px; color: var(--soft); background: var(--surface-2); border: 0; }
  .journal .jnote { font-size: 12px; color: var(--muted-2); }
  .recent button { display: flex; gap: 10px; width: 100%; padding: 11px 0; border: 0; border-top: 1px solid var(--border);
                   background: none; color: var(--text); font: inherit; font-size: 15px; text-align: left; cursor: pointer; }
  .recent button .d { color: var(--soft); flex: none; width: 52px; font-variant-numeric: tabular-nums; }
  .recent button .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent button .v { flex: none; color: var(--muted-2); font-size: 12px; }
  .recent button.editing { color: var(--accent); }

  /* auth */
  .auth { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
  .auth .card { width: min(340px, 100%); }
  .auth h1 { font-size: 22px; margin-bottom: 4px; }
  .auth input { margin: 14px 0 10px; }
  .auth .btn { width: 100%; }
  .auth-status { margin-top: 10px; font-size: 13px; color: var(--soft); min-height: 1em; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--surface-2); border: 1px solid var(--border-2);
           padding: 9px 14px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main id="app"><p class="muted" style="padding-top:24px">loading…</p></main>

<!-- yes/no day: long-press a cell, or tap a calendar day -->
<dialog id="day-dialog">
  <form method="dialog">
    <div class="dlg-head"><b id="day-habit"></b><div class="muted" id="day-date"></div></div>
    <div class="tick">
      <button type="button" class="big" data-v="yes" aria-label="Done"></button>
      <button type="button" class="big" data-v="no" aria-label="Not done"></button>
      <button type="button" class="big" data-v="skip" aria-label="Skip this day"></button>
    </div>
    <textarea id="day-notes" rows="3" placeholder="Notes"></textarea>
    <div class="actions"><button type="button" class="tb" id="day-cancel">CANCEL</button><button class="tb accent" value="save">SAVE</button></div>
  </form>
</dialog>

<!-- measurable day: tap a cell -->
<dialog id="num-pop">
  <form method="dialog">
    <textarea id="np-notes" rows="2" placeholder="Notes"></textarea>
    <div class="np-unit" id="np-unit"></div>
    <div class="np-row"><input id="np-value" type="number" step="any" inputmode="decimal" placeholder="0" aria-label="Value"><button value="save">SAVE</button></div>
  </form>
</dialog>

<dialog id="menu-dialog">
  <div class="dlg-head"><b>Data</b><div class="muted" id="menu-who"></div></div>
  <div class="menu" style="margin-top:8px">
    <button id="menu-import">Import backup (.json)…</button>
    <button id="menu-export">Export backup (.json)</button>
    <button id="menu-csv">Export CSV</button>
    <button class="danger" id="menu-signout">Sign out</button>
  </div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <div class="actions"><button class="tb" onclick="this.closest('dialog').close()">CLOSE</button></div>
</dialog>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="engine.js"></script>
<script>
'use strict';
// The publishable key is meant to be public. Row-level security policies (supabase/schema.sql)
// are what restrict each signed-in user to their own rows.
const SUPABASE_URL = 'https://sjycdaxraklxlnrmgqrb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_gpJ7aoxecKwhPrHRDdzddA_rdMsRlPN';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const E = window.HabitEngine, V = E.V;

// Loop's dark-theme colors, trimmed to ten. Habits saved with the first palette are shown in its nearest match.
const COLORS = ['#e57373', '#ff8a65', '#ffb74d', '#81c784', '#4db6ac', '#64b5f6', '#7986cb', '#ba68c8', '#f06292', '#bdbdbd'];
const LEGACY = {'#3f8f6b': '#81c784', '#5b7fbf': '#64b5f6', '#c0703a': '#ff8a65', '#8a5a9e': '#ba68c8', '#b5793a': '#ffb74d',
                '#c4553f': '#e57373', '#4f8a8b': '#4db6ac', '#a0a03a': '#ffb74d', '#d0679d': '#f06292', '#7a7a74': '#bdbdbd'};
const hc = h => LEGACY[(h.color || '').toLowerCase()] || h.color || COLORS[5];

const ICON = {
  plus: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>',
  more: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4m0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4m0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4"/></svg>',
  pen: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75zM20.7 7.04a1 1 0 0 0 0-1.41l-2.33-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z"/></svg>',
  filter: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M10 18h4v-2h-4zM3 6v2h18V6zm3 7h12v-2H6z"/></svg>',
  chev: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>',
  back: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>',
  close: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>',
  skip: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M5.59 7.41 10.18 12l-4.59 4.59L7 18l6-6-6-6zM11.59 7.41 16.18 12l-4.59 4.59L13 18l6-6-6-6z"/></svg>',
};
const FREQS = [['1/1', 'Every day'], ['6/7', '6x per week'], ['5/7', '5x per week'], ['4/7', '4x per week'], ['3/7', '3x per week'],
               ['2/7', '2x per week'], ['1/7', 'Once a week'], ['1/2', 'Every other day'], ['1/14', 'Every 2 weeks'], ['1/30', 'Once a month']];

// ------------------------------------------------------------------ state

let user = null;
let habits = [];                 // rows from `habits`
let entries = new Map();         // habit id -> Map(day -> {value, notes})
const statsCache = new Map();    // habit id -> engine.analyze() result
/* Home's filter menu, remembered per device. */
const VIEW_KEY = 'habits.view';
const view = Object.assign({sort: 'manual', hideDone: false, showArchived: false, collapsed: []},
  (() => { try { return JSON.parse(localStorage.getItem(VIEW_KEY)) || {}; } catch { return {}; } })());
/* Groups need supabase/groups.sql. Until it has run, rows have no group_name and the app behaves as before. */
const hasGroups = () => habits.some(h => 'group_name' in h);
const groupOf = h => (h.group_name || '').trim();
const AREAS = ['health-wellness', 'career', 'admin', 'social', 'hobbies'];   // the vault's areas, offered as suggestions
const saveView = () => { try { localStorage.setItem(VIEW_KEY, JSON.stringify(view)); } catch {} };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const today = () => E.localToday();
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400); }
function fail(error, what) { console.error(error); toast(`${what} failed: ${error.message || error}`); }

function stats(h) {
  let st = statsCache.get(h.id);
  if (!st) {
    const es = [...(entries.get(h.id) || new Map())].map(([day, e]) => ({day, value: e.value, notes: e.notes}));
    st = E.analyze(h, es, today());
    statsCache.set(h.id, st);
  }
  return st;
}

function freqLabel(h) {
  const {num: n, den: d} = E.frequency(h);
  if (n === 1 && d === 1) return 'every day';
  if (d === 7) return n === 1 ? 'once a week' : `${n}x per week`;
  if (d === 30 || d === 31) return n === 1 ? 'once a month' : `${n}x per month`;
  return n > 1 ? `${n}x every ${d} days` : `every ${d} days`;
}
const fmtNum = x => Math.abs(x) >= 10 ? x.toFixed(0) : String(+x.toFixed(1));
const fmtRaw = x => String(+(x / 1000).toFixed(3));

/* display state of one day: {day, text, cls, raw, notes} — raw is what was actually logged */
function dayInfo(h, st, day) {
  if (day > st.today) return {day, text: '', cls: 'future', raw: '', notes: ''};
  const v = st.value(day), logged = (entries.get(h.id) || new Map()).get(day);
  let text = '', cls = 'unknown';
  if (E.isNumerical(h)) {
    if (v !== V.UNKNOWN) { text = fmtNum(v / 1000); cls = E.isSuccess(h, v) ? 'yes' : 'partial'; }
  } else {
    [text, cls] = {[V.YES_MANUAL]: ['✓', 'yes'], [V.YES_AUTO]: ['·', 'auto'], [V.SKIP]: ['»', 'skip'], [V.NO]: ['✗', 'no']}[v] || ['', 'unknown'];
  }
  let raw = '';
  if (logged && logged.value !== V.UNKNOWN)
    raw = E.isNumerical(h) ? fmtRaw(logged.value) : ({[V.YES_MANUAL]: 'yes', [V.NO]: 'no', [V.SKIP]: 'skip'}[logged.value] || '');
  return {day, text, cls, raw, notes: logged ? logged.notes : ''};
}
const dayAttrs = (h, c) => `data-habit="${h.id}" data-day="${c.day}" data-raw="${esc(c.raw)}"` + (c.cls !== 'future' ? ' tabindex="0" role="button"' : '');

// ------------------------------------------------------------------ data

async function loadAll() {
  const {data: hs, error} = await sb.from('habits').select('*').order('position').order('created_at');
  if (error) throw error;
  const all = [];
  for (let from = 0; ; from += 1000) {   // PostgREST returns at most 1000 rows per request
    const {data, error: e2} = await sb.from('habit_entries').select('habit_id,date,value,notes')
      .order('habit_id').order('date').range(from, from + 999);
    if (e2) throw e2;
    all.push(...data);
    if (data.length < 1000) break;
  }
  habits = hs;
  entries = new Map(hs.map(h => [h.id, new Map()]));
  for (const r of all) (entries.get(r.habit_id) || entries.set(r.habit_id, new Map()).get(r.habit_id))
    .set(E.toDay(r.date), {value: r.value, notes: r.notes || ''});
  statsCache.clear();
}

/* Same rule as the Python repo: UNKNOWN with no notes deletes the row, so the table only holds facts. */
async function setEntry(h, day, value, notes) {
  const map = entries.get(h.id), prev = map.get(day), iso = E.toIso(day);
  const del = value === V.UNKNOWN && !notes;
  if (del) map.delete(day); else map.set(day, {value, notes});
  statsCache.delete(h.id);
  render();
  const q = del ? sb.from('habit_entries').delete().eq('habit_id', h.id).eq('date', iso)
                : sb.from('habit_entries').upsert({habit_id: h.id, date: iso, value, notes}, {onConflict: 'habit_id,date'});
  const {error} = await q;
  if (error) {   // roll back the optimistic change
    if (prev) map.set(day, prev); else map.delete(day);
    statsCache.delete(h.id); render(); fail(error, 'Save');
  }
}

async function saveHabit(row) {
  const {error} = await sb.from('habits').upsert(row);
  if (error) { fail(error, 'Save'); return false; }
  const i = habits.findIndex(h => h.id === row.id);
  if (i >= 0) habits[i] = {...habits[i], ...row}; else { habits.push(row); entries.set(row.id, new Map()); }
  statsCache.delete(row.id);
  return true;
}

// ------------------------------------------------------------------ journal (supabase/journal.sql)
/* The composer lives on the Journal page (✎ on Home). Entries wait in `journal_entries` until the vault's
   _automations/pull_journal.py copies them into Journal/YYYY-MM.md and sets pulled_at;
   from then on the vault owns them and they're read-only here. */

let journal = [];                // recent rows, newest first
let journalError = '';
let editing = null;              // id of the entry loaded into the composer, or null
const DRAFT_KEY = 'habits.journalDraft';
const loadDraft = () => { try { return JSON.parse(localStorage.getItem(DRAFT_KEY)) || {}; } catch { return {}; } };
const saveDraft = d => { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); } catch {} };

/* The vault's quick_log rule: a short first line followed by more text is the title. */
function splitEntry(text) {
  const t = text.trim(), i = t.indexOf('\n');
  if (i > 0) {
    const first = t.slice(0, i).trim(), rest = t.slice(i + 1).trim();
    if (rest && first.length <= 80) return {title: first, body: rest};
  }
  return {title: '', body: t};
}
const joinEntry = e => e.title ? `${e.title}\n${e.body}` : e.body;

async function loadJournal() {
  const {data, error} = await sb.from('journal_entries').select('id,entry_date,title,body,created_at,pulled_at')
    .order('created_at', {ascending: false}).limit(30);
  if (error) {
    console.error(error);
    journalError = /(does not exist|schema cache)/.test(error.message || '')
      ? 'Journal table missing: run habits/supabase/journal.sql in the Supabase SQL editor.' : `Couldn't load entries: ${error.message}`;
    journal = [];
  } else { journalError = ''; journal = data; }
}

const composer = document.createElement('section');
composer.className = 'journal';
composer.innerHTML = `
  <textarea id="j-text" placeholder="What's on your mind?" aria-label="Journal entry"></textarea>
  <div class="jbar">
    <input type="date" id="j-date" aria-label="Entry date">
    <span class="jnote" id="j-note"></span><span class="spacer"></span>
    <button class="btn danger" id="j-delete" hidden>Delete</button>
    <button class="btn" id="j-cancel" hidden>Cancel</button>
    <button class="btn primary" id="j-save">Save</button>
  </div>`;
const recent = document.createElement('section');
recent.className = 'recent';
recent.innerHTML = '<h2>Recent</h2><div id="j-recent"></div>';
const jRecent = recent.querySelector('#j-recent');
const jText = composer.querySelector('#j-text'), jDate = composer.querySelector('#j-date');

function autosize() { jText.style.height = 'auto'; jText.style.height = jText.scrollHeight + 2 + 'px'; }
/* The date is stored in the draft only when backdated, so a draft started yesterday saves as today. */
function persistDraft() {
  const d = jDate.value !== E.toIso(today()) ? jDate.value : null;
  saveDraft({text: jText.value, date: d, editing});
}

function renderJournal() {
  const isEdit = editing !== null;
  composer.querySelector('#j-save').textContent = isEdit ? 'Update' : 'Save';
  composer.querySelector('#j-cancel').hidden = !isEdit;
  composer.querySelector('#j-delete').hidden = !isEdit;
  composer.querySelector('#j-note').textContent = journalError || (isEdit ? 'editing' : '');
  const md = iso => new Date(iso + 'T00:00:00Z').toLocaleDateString(undefined, {month: 'short', day: 'numeric', timeZone: 'UTC'});
  recent.hidden = !journal.length;
  jRecent.innerHTML = journal.map(e => {
    const label = e.title || e.body.slice(0, 120);
    return `<button data-id="${e.id}" class="${e.id === editing ? 'editing' : ''}"><span class="d">${md(e.entry_date)}</span>
      <span class="t">${esc(label) || '<span class="muted">(empty)</span>'}</span>${e.pulled_at ? '<span class="v">in vault</span>' : ''}</button>`;
  }).join('');
}

function resetComposer() {
  editing = null; jText.value = ''; jDate.value = E.toIso(today());
  saveDraft({}); autosize(); renderJournal();
}

async function saveJournal() {
  const {title, body} = splitEntry(jText.value);
  if (!title && !body) return jText.focus();
  const btn = composer.querySelector('#j-save'); btn.disabled = true;
  const row = {entry_date: jDate.value || E.toIso(today()), title, body};
  const {data, error} = editing
    ? await sb.from('journal_entries').update(row).eq('id', editing).select().single()
    : await sb.from('journal_entries').insert(row).select().single();
  btn.disabled = false;
  if (error) return fail(error, 'Save');   // the draft stays in localStorage
  const i = journal.findIndex(e => e.id === data.id);
  if (i >= 0) journal[i] = data; else journal.unshift(data);
  toast(editing ? 'Updated' : 'Saved');
  resetComposer();
}

function startEdit(id) {
  const e = journal.find(x => x.id === id);
  if (!e) return;
  if (e.pulled_at) return toast('Already in the vault: edit it in Obsidian');
  if (!editing && jText.value.trim() && !confirm('Replace what you were writing?')) return;
  editing = id; jText.value = joinEntry(e); jDate.value = e.entry_date;
  persistDraft(); autosize(); renderJournal(); jText.focus();
}

async function deleteJournal() {
  if (!editing || !confirm('Delete this entry?')) return;
  const {error} = await sb.from('journal_entries').delete().eq('id', editing);
  if (error) return fail(error, 'Delete');
  journal = journal.filter(e => e.id !== editing);
  toast('Deleted'); resetComposer();
}

jText.addEventListener('input', () => { autosize(); persistDraft(); });
jDate.addEventListener('change', persistDraft);
jText.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveJournal(); } });
composer.querySelector('#j-save').addEventListener('click', saveJournal);
composer.querySelector('#j-cancel').addEventListener('click', resetComposer);
composer.querySelector('#j-delete').addEventListener('click', deleteJournal);
jRecent.addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if (b) startEdit(b.dataset.id); });

function restoreDraft() {
  const d = loadDraft();
  jText.value = d.text || ''; jDate.value = d.date || E.toIso(today());
  editing = d.editing && journal.some(e => e.id === d.editing && !e.pulled_at) ? d.editing : null;
  if (d.editing && !editing && jText.value.trim()) toast('That entry is in the vault now: saving makes a new one');
  autosize(); renderJournal();
}

// ------------------------------------------------------------------ views

function route() {
  const [, view, id, month] = (location.hash || '#/').split('/');
  return {view: view || 'home', id, month};
}

let lastView = '', lastKey = '';
function render() {
  if (!user) return;
  const r = route();
  const h = r.id && habits.find(x => x.id === r.id);
  if ((r.view === 'habit' || r.view === 'edit') && !h) { location.hash = '#/'; return; }
  const typing = document.activeElement === jText, key = location.hash;
  const scrolls = {};
  if (key === lastKey) document.querySelectorAll('[data-scroll]').forEach(el => { scrolls[el.dataset.scroll] = el.scrollLeft; });
  closePop();
  $('app').innerHTML = r.view === 'habit' ? viewDetail(h) : r.view === 'new' ? viewForm(null)
                     : r.view === 'edit' ? viewForm(h) : r.view === 'journal' ? viewJournal() : viewHome();
  const slot = $('composer-slot'), rslot = $('recent-slot');
  if (rslot) rslot.replaceWith(recent);
  if (slot) { slot.replaceWith(composer); autosize(); if (typing || lastView !== 'journal') jText.focus(); }
  document.querySelectorAll('[data-scroll]').forEach(el => { el.scrollLeft = el.dataset.scroll in scrolls ? scrolls[el.dataset.scroll] : 1e6; });
  lastKey = key;
  if (r.view === 'new' || r.view === 'edit') bindForm(h);
  lastView = r.view;
}

/* Day columns: 5 on a phone, more as the window widens (Loop does the same). */
function columns() {
  const w = Math.min(window.innerWidth, 760) - 32, col = w < 480 ? 42 : 48;
  return {n: Math.max(5, Math.min(14, Math.floor((w - 150) / col))), col};
}
let lastCols = columns().n;
window.addEventListener('resize', () => {
  clearTimeout(window._rz);
  window._rz = setTimeout(() => { const n = columns().n; if (n !== lastCols && route().view === 'home') { lastCols = n; render(); } }, 120);
});

function ring(score, color) {
  const c = 2 * Math.PI * 8.5, len = Math.max(0, Math.min(1, score)) * c;
  return `<svg class="ring" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.5" fill="none" stroke="#333" stroke-width="3.4"/>
    <circle cx="11" cy="11" r="8.5" fill="none" stroke="${esc(color)}" stroke-width="3.4" stroke-dasharray="${len.toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 11 11)"/></svg>`;
}

/* One day on Home: a glyph, never a box. */
function mark(h, st, day) {
  const c = dayInfo(h, st, day), color = esc(hc(h));
  let inner, style = '', cls = 'mark day';
  if (E.isNumerical(h)) {
    cls += ' num';
    if (c.cls === 'yes') style = `color:${color}`;
    else if (c.cls === 'partial') style = `color:${color};opacity:.6`;
    inner = c.text || '0';
  } else if (c.cls === 'yes') { style = `color:${color}`; inner = ICON.check; }
  else if (c.cls === 'auto') { style = `color:${color};opacity:.4`; inner = ICON.check; }
  else if (c.cls === 'skip') { inner = ICON.skip; }
  else { cls += c.cls === 'no' ? ' no' : ''; inner = ICON.close; }
  const label = `${h.name}, ${E.toIso(day)}: ${c.raw || 'not logged'}${c.notes ? ' · ' + c.notes : ''}`;
  return `<div class="${cls}" ${dayAttrs(h, c)} data-act="toggle" style="${style}" title="${esc(label)}" aria-label="${esc(label)}">${inner}${c.notes ? '<span class="nd"></span>' : ''}</div>`;
}

function viewHome() {
  const t = today(), {n, col} = columns(), days = Array.from({length: n}, (_, i) => t - i);   // newest first, like Loop
  lastCols = n;
  const doneToday = h => ['yes', 'auto', 'skip'].includes(dayInfo(h, stats(h), t).cls);
  const order = {manual: (a, b) => a.position - b.position, name: (a, b) => a.name.localeCompare(b.name),
                 color: (a, b) => COLORS.indexOf(hc(a)) - COLORS.indexOf(hc(b)) || a.position - b.position,
                 score: (a, b) => stats(b).score() - stats(a).score()}[view.sort] || ((a, b) => a.position - b.position);
  const shown = habits.filter(h => (view.showArchived || !h.archived) && !(view.hideDone && doneToday(h))).sort(order);
  const draft = (loadDraft().text || '').trim();
  const wd = d => new Date(d * 86400000).toLocaleDateString(undefined, {weekday: 'short', timeZone: 'UTC'}).toUpperCase();
  const bar = `<div class="bar"><div class="bar-row"><h1>Habits</h1>
      <a class="ib" href="#/journal" aria-label="Journal">${ICON.pen}${draft ? '<span class="badge"></span>' : ''}</a>
      <a class="ib" href="#/new" aria-label="New habit">${ICON.plus}</a>
      <button class="ib" onclick="filterMenu(this)" aria-label="Sort and filter">${ICON.filter}</button>
      <button class="ib" onclick="openMenu()" aria-label="Data and account">${ICON.more}</button></div>
    ${habits.length ? `<div class="hrow days"><div></div>${days.map(d => `<div>${wd(d)}<b>${E.parts(d).d}</b></div>`).join('')}</div>` : ''}</div>`;
  if (!habits.length) return `<div style="--n:${n};--col:${col}px">${bar}<div class="empty">No habits yet.<br><br>
    <a class="btn primary" href="#/new">Create one</a> <button class="btn" onclick="$('import-file').click()">Import a backup</button></div></div>`;
  const row = h => { const st = stats(h);
    return `<div class="hrow habit${h.archived ? ' archived' : ''}">
      <a class="hname" href="#/habit/${h.id}">${ring(st.score(), hc(h))}<span style="color:${esc(hc(h))}">${esc(h.name)}</span></a>
      ${days.map(d => mark(h, st, d)).join('')}</div>`; };
  // Ungrouped habits first, then one collapsible section per group (A→Z). Sorting applies inside each group.
  const groups = new Map([['', []]]);
  for (const h of shown) { const g = groupOf(h); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(h); }
  const names = [...groups.keys()].filter(Boolean).sort((a, b) => a.localeCompare(b));
  const rows = groups.get('').map(row).join('') + names.map(g => {
    const hs = groups.get(g), closed = view.collapsed.includes(g), done = hs.filter(doneToday).length;
    return `<button class="ghead${closed ? ' closed' : ''}" data-group="${esc(g)}" aria-expanded="${!closed}">${ICON.chev}
      <span class="gn">${esc(g)}</span><span class="gc">${done}/${hs.length} today</span></button>${closed ? '' : hs.map(row).join('')}`;
  }).join('');
  const none = view.hideDone && habits.some(h => !h.archived) ? 'All done for today.' : 'Nothing here.';
  return `<div style="--n:${n};--col:${col}px">${bar}${rows || `<div class="empty">${none}</div>`}</div>`;
}

$('app').addEventListener('click', e => {
  const b = e.target.closest('.ghead'); if (!b) return;
  const g = b.dataset.group;
  view.collapsed = view.collapsed.includes(g) ? view.collapsed.filter(x => x !== g) : [...view.collapsed, g];
  saveView(); render();
});

function filterMenu(btn) {
  const set = (k, v) => () => { view[k] = v; saveView(); render(); };
  const sorts = [['manual', 'Manual order'], ['name', 'Name'], ['color', 'Color'], ['score', 'Score']];
  const nArch = habits.filter(h => h.archived).length;
  openPop(btn, [{head: 'Sort'}, ...sorts.map(([k, l]) => ({label: l, on: view.sort === k, fn: set('sort', k)})), '-',
    {label: 'Hide completed', on: view.hideDone, fn: set('hideDone', !view.hideDone)},
    {label: `Show archived${nArch ? ` (${nArch})` : ''}`, on: view.showArchived, fn: set('showArchived', !view.showArchived)}]);
}

function viewJournal() {
  return `<div class="bar"><div class="bar-row"><a class="ib" href="#/" aria-label="Back">${ICON.back}</a><h1>Journal</h1></div></div>
    <div id="composer-slot"></div><div id="recent-slot"></div>`;
}

// ------------------------------------------------------------------ habit page

/* Small popup menu under an icon button (⋮ on the habit page, filter on Home). */
function openPop(anchor, items) {
  closePop();
  const r = anchor.getBoundingClientRect(), m = document.createElement('div');
  m.className = 'popmenu'; m.id = 'popmenu';
  m.style.top = `${r.bottom + 4}px`; m.style.right = `${Math.max(8, window.innerWidth - r.right)}px`;
  m.innerHTML = items.map((it, i) => it === '-' ? '<hr>' : it.head ? `<div class="ph">${esc(it.head)}</div>`
    : `<button data-i="${i}" class="${it.danger ? 'danger' : ''}${it.on ? ' on' : ''}">${esc(it.label)}</button>`).join('');
  m.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (b) { closePop(); items[+b.dataset.i].fn(); } });
  document.body.append(m);
  setTimeout(() => { popOff = e => { if (!e.target.closest('#popmenu')) closePop(); }; document.addEventListener('click', popOff); });
}
let popOff = null;   // the outside-click listener of the open menu
function closePop() {
  const m = $('popmenu'); if (m) m.remove();
  if (popOff) { document.removeEventListener('click', popOff); popOff = null; }
}

const detailOpts = {score: 'month', hist: 'week', edit: false};
let detailHabit = null;
const MS = 86400000;
const sun = d => new Date(d * MS).getUTCDay();                 // 0 = Sunday, like Loop's calendar
const monShort = d => new Date(d * MS).toLocaleDateString(undefined, {month: 'short', timeZone: 'UTC'});
function bStart(d, u) {
  const p = E.parts(d);
  if (u === 'week') return d - sun(d);
  if (u === 'month') return Date.UTC(p.y, p.m - 1, 1) / MS;
  if (u === 'quarter') return Date.UTC(p.y, Math.floor((p.m - 1) / 3) * 3, 1) / MS;
  return Date.UTC(p.y, 0, 1) / MS;
}
function bNext(b, u) {
  if (u === 'week') return b + 7;
  const p = E.parts(b);
  return Date.UTC(p.y, p.m - 1 + {month: 1, quarter: 3, year: 12}[u], 1) / MS;
}
/* Bucket starts from the habit's first entry to today, at least `min` of them, at most 120. */
function buckets(from, to, u, min = 6) {
  const out = [];
  for (let b = bStart(from, u); b <= to; b = bNext(b, u)) out.push(b);
  while (out.length < min) out.unshift(bStart((out[0] ?? bStart(to, u)) - 1, u));
  return out.slice(-120);
}
function bLabel(b, u, prev) {
  const p = E.parts(b), q = prev === undefined ? null : E.parts(prev);
  const year = !q || q.y !== p.y ? String(p.y) : '';
  if (u === 'week') return [!q || q.m !== p.m ? monShort(b) : String(p.d), year];
  if (u === 'month') return [monShort(b), year];
  if (u === 'quarter') return [`Q${Math.floor((p.m - 1) / 3) + 1}`, year];
  return [String(p.y), ''];
}
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const unitSel = (name, cur, opts) => `<select class="sel" onchange="detailOpts.${name}=this.value;render()">${opts.map(o =>
  `<option value="${o}"${o === cur ? ' selected' : ''}>${o[0].toUpperCase() + o.slice(1)}</option>`).join('')}</select>`;
const xLabels = (bs, u, x, y) => bs.map((b, i) => { const [a, yr] = bLabel(b, u, bs[i - 1]);
  return `<text x="${x(i)}" y="${y}" text-anchor="middle">${a}</text>${yr ? `<text x="${x(i)}" y="${y + 16}" text-anchor="middle">${yr}</text>` : ''}`; }).join('');

function scoreChart(h, st, color) {
  const u = detailOpts.score, t = st.today, bs = buckets(st.start, t, u), slot = 48, padL = 44, top = 12, ph = 160;
  const x = i => padL + i * slot + slot / 2, y = v => top + ph * (1 - v), W = padL + bs.length * slot + 8, H = top + ph + 44;
  const vals = bs.map(b => st.score(Math.min(bNext(b, u) - 1, t)));
  const grid = [0, .2, .4, .6, .8, 1].map(v => `<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#262626"/>`).join('');
  const pts = vals.map((v, i) => `${x(i)},${y(v).toFixed(1)}`).join(' ');
  const labels = [1, .8, .6, .4, .2].map(v => `<span class="ylab" style="top:${y(v) - 18}px">${v * 100}%</span>`).join('');
  return `<div class="chart">${labels}<div class="hscroll" data-scroll="score"><svg width="${W}" height="${H}" font-size="12" fill="#9e9e9e">${grid}
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5"/>
    ${vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v).toFixed(1)}" r="4.5" fill="${color}"><title>${Math.round(v * 100)}%</title></circle>`).join('')}
    ${xLabels(bs, u, x, top + ph + 20)}</svg></div></div>`;
}

function historyChart(h, st, color) {
  const u = detailOpts.hist, t = st.today, bs = buckets(st.start, t, u), slot = 44, top = 20, ph = 150;
  const logged = entries.get(h.id) || new Map(), numerical = E.isNumerical(h);
  const vals = bs.map(b => { let sum = 0; for (let d = b, e = Math.min(bNext(b, u) - 1, t); d <= e; d++) { const v = logged.get(d);
    if (v) sum += numerical ? Math.max(0, v.value) / 1000 : v.value === V.YES_MANUAL ? 1 : 0; } return sum; });
  const max = Math.max(...vals, 1), x = i => i * slot + slot / 2, W = bs.length * slot, H = top + ph + 44;
  const grid = [0, .25, .5, .75, 1].map(v => `<line x1="0" x2="${W}" y1="${top + ph * (1 - v)}" y2="${top + ph * (1 - v)}" stroke="#262626"/>`).join('');
  const bars = vals.map((v, i) => { const bh = ph * v / max;
    return v ? `<rect x="${x(i) - 10}" y="${top + ph - bh}" width="20" height="${bh}" fill="${color}"/><text x="${x(i)}" y="${top + ph - bh - 6}" text-anchor="middle" fill="${color}">${fmtNum(v)}</text>` : ''; }).join('');
  return `<div class="hscroll" data-scroll="hist"><svg width="${W}" height="${H}" font-size="12" fill="#9e9e9e">${grid}${bars}${xLabels(bs, u, x, top + ph + 20)}</svg></div>`;
}

function calendar(h, st, color) {
  const t = st.today, first = bStart(Math.max(Math.min(st.start, t - 7 * 20), t - 7 * 104), 'week'), weeks = (bStart(t, 'week') - first) / 7 + 1;
  // Month label above the week holding the 1st (the year instead of "Jan"); the first column says month and year
  // unless a real label follows too closely to fit it.
  const labs = [...Array(weeks)].map((_, w) => {
    const ws = first + w * 7, has1 = [...Array(7)].map((_, k) => ws + k).find(d => E.parts(d).d === 1);
    return w === 0 ? `${monShort(ws)} ${E.parts(ws).y}` : has1 === undefined ? '' : E.parts(has1).m === 1 ? String(E.parts(has1).y) : monShort(has1);
  });
  if (labs.slice(1, 3).some(Boolean)) labs[0] = '';
  let cells = '';
  for (let w = 0; w < weeks; w++) {
    const ws = first + w * 7;
    cells += `<div class="ml">${labs[w]}</div>`;
    for (let k = 0; k < 7; k++) {
      const d = ws + k, c = dayInfo(h, st, d);
      const bg = c.cls === 'yes' ? color : c.cls === 'auto' ? rgba(color, .35) : c.cls === 'partial' ? rgba(color, .6) : '';
      const label = `${E.toIso(d)}: ${c.raw || 'not logged'}${c.notes ? ' · ' + c.notes : ''}`;
      cells += `<div class="cq day ${c.cls}${d === t ? ' today' : ''}" ${c.cls === 'future' ? '' : dayAttrs(h, c)}${detailOpts.edit ? ' data-act="toggle"' : ''}
        style="${bg ? `background:${bg}` : ''}" title="${esc(label)}">${c.cls === 'future' ? '' : E.parts(d).d}${c.notes ? '<span class="nd"></span>' : ''}</div>`;
    }
  }
  const wd = [...Array(7)].map((_, k) => new Date((3 + k) * MS).toLocaleDateString(undefined, {weekday: 'short', timeZone: 'UTC'}));   // 1970-01-04 was a Sunday
  return `<div class="calwrap"><div class="hscroll" data-scroll="cal"><div class="cal">${cells}</div></div>
    <div class="wdays"><div></div>${wd.map(w => `<div>${w}</div>`).join('')}</div></div>
    <div class="cal-edit"><button class="tb${detailOpts.edit ? ' on' : ''}" onclick="detailOpts.edit=!detailOpts.edit;render()">${detailOpts.edit ? 'DONE' : 'EDIT'}</button></div>`;
}

function viewDetail(h) {
  if (detailHabit !== h.id) { detailHabit = h.id; detailOpts.edit = false; }
  const st = stats(h), numerical = E.isNumerical(h), color = hc(h);
  const target = numerical ? ` · ${h.target_type.replace('_', ' ')} ${+h.target_value} ${esc(h.unit)}` : '';
  const logged = [...(entries.get(h.id) || new Map()).values()];
  const total = numerical ? fmtNum(logged.reduce((a, e) => a + Math.max(0, e.value), 0) / 1000) : logged.filter(e => e.value === V.YES_MANUAL).length;
  const fmtShort = d => { const p = E.parts(d), y = E.parts(st.today).y;
    return new Date(d * MS).toLocaleDateString(undefined, {month: 'short', day: 'numeric', ...(p.y !== y ? {year: '2-digit'} : {}), timeZone: 'UTC'}); };
  const top = [...st.streaks].sort((a, b) => b.length - a.length).slice(0, 5), maxS = top.length ? top[0].length : 1;
  const notes = [...(entries.get(h.id) || new Map())].filter(([, e]) => e.notes).sort((a, b) => b[0] - a[0]).slice(0, 50);
  return `<div style="--hc:${esc(color)}">
    <div class="bar"><div class="bar-row"><a class="ib" href="#/" aria-label="Back">${ICON.back}</a><h1>${esc(h.name)}</h1>
      <a class="ib" href="#/edit/${h.id}" aria-label="Edit habit">${ICON.pen}</a>
      <button class="ib" onclick="habitMenu(this,'${h.id}')" aria-label="More">${ICON.more}</button></div></div>
    <p class="sub">${esc(h.question)}${h.question ? ' · ' : ''}${freqLabel(h)}${target}${groupOf(h) ? ' · ' + esc(groupOf(h)) : ''}${h.archived ? ' · archived' : ''}</p>
    <div class="sec"><h2>Overview</h2></div>
    <div class="overview">
      <div><b>${Math.round(st.score() * 100)}%</b><span>Score</span></div>
      <div><b>${st.currentStreak}</b><span>Streak</span></div>
      <div><b>${st.bestStreak}</b><span>Best streak</span></div>
      <div><b>${total}</b><span>Total${numerical && h.unit ? ' ' + esc(h.unit) : ''}</span></div>
    </div>
    <div class="sec"><h2>Score</h2>${unitSel('score', detailOpts.score, ['week', 'month', 'quarter'])}</div>
    ${scoreChart(h, st, color)}
    <div class="sec"><h2>History</h2>${unitSel('hist', detailOpts.hist, ['week', 'month', 'quarter', 'year'])}</div>
    ${historyChart(h, st, color)}
    <div class="sec"><h2>Calendar</h2></div>
    ${calendar(h, st, color)}
    ${top.length ? `<div class="sec"><h2>Best streaks</h2></div><div class="streaks">${top.map(s => `<div><span>${fmtShort(s.start)}</span>
      <div class="sb" style="width:${Math.max(12, 100 * s.length / maxS)}%">${s.length}</div><span>${fmtShort(s.end)}</span></div>`).join('')}</div>` : ''}
    <div class="sec"><h2>Notes</h2></div>
    ${notes.length ? `<div class="notes">${notes.map(([d, e]) => `<div><span class="d">${fmtShort(d)}</span><span>${esc(e.notes)}</span></div>`).join('')}</div>`
                   : '<p class="muted">No notes yet. Long-press a day to add one.</p>'}
  </div>`;
}

function habitMenu(btn, id) {
  const h = habits.find(x => x.id === id);
  openPop(btn, [{label: 'Edit', fn: () => { location.hash = `#/edit/${id}`; }},
                {label: h.archived ? 'Unarchive' : 'Archive', fn: () => toggleArchive(id)}, '-',
                {label: 'Delete', danger: true, fn: () => deleteHabit(id)}]);
}

function viewForm(h) {
  const cur = h ? `${h.freq_num}/${h.freq_den}` : '1/1';
  const freqs = FREQS.some(([v]) => v === cur) ? FREQS : [...FREQS, [cur, `${h.freq_num}x every ${h.freq_den} days`]];
  const color = h ? hc(h) : COLORS[habits.length % COLORS.length];
  const colors = COLORS.includes(color) ? COLORS : [...COLORS, color];
  const numerical = h && h.type === 'numerical';
  return `<div class="bar"><div class="bar-row"><a class="ib" href="${h ? `#/habit/${h.id}` : '#/'}" aria-label="Back">${ICON.back}</a>
      <h1>${h ? 'Edit habit' : 'New habit'}</h1><button class="tb accent" form="habit-form">SAVE</button></div></div>
  <form class="stack" id="habit-form">
    <label for="f-name">Name</label><input id="f-name" name="name" required maxlength="80" value="${esc(h?.name)}" placeholder="e.g. Run">
    <label for="f-question">Question</label><input id="f-question" name="question" maxlength="200" value="${esc(h?.question)}" placeholder="e.g. Did you run today?">
    <div class="row">
      <div><label for="f-type">Type</label><select id="f-type" name="type">
        <option value="yes_no"${numerical ? '' : ' selected'}>Yes / No</option><option value="numerical"${numerical ? ' selected' : ''}>Measurable</option></select></div>
      <div><label for="f-freq">Frequency</label><select id="f-freq" name="freq">${freqs.map(([v, l]) => `<option value="${v}"${v === cur ? ' selected' : ''}>${l}</option>`).join('')}</select></div>
    </div>
    <div class="row" id="f-numeric"${numerical ? '' : ' hidden'}>
      <div><label for="f-tt">Target</label><select id="f-tt" name="target_type">
        <option value="at_least"${h?.target_type === 'at_most' ? '' : ' selected'}>At least</option><option value="at_most"${h?.target_type === 'at_most' ? ' selected' : ''}>At most</option></select></div>
      <div><label for="f-tv">Amount</label><input id="f-tv" name="target_value" type="number" step="any" min="0" value="${h ? +h.target_value : ''}"></div>
      <div><label for="f-unit">Unit</label><input id="f-unit" name="unit" maxlength="20" value="${esc(h?.unit)}" placeholder="miles"></div>
    </div>
    <p class="muted" id="f-numhint" style="margin-top:8px"${numerical ? '' : ' hidden'}>The score compares the total over each frequency window (e.g. 7 days for once a week) with the target.</p>
    <label>Color</label>
    <div class="swatches">${colors.map(c => `<label><input type="radio" name="color" value="${c}"${c === color ? ' checked' : ''}><span style="background:${c}"></span></label>`).join('')}</div>
    ${hasGroups() ? `<label for="f-group">Group</label><input id="f-group" name="group_name" list="f-groups" maxlength="40" value="${esc(h ? groupOf(h) : '')}" placeholder="none, or e.g. health-wellness" autocomplete="off">
    <datalist id="f-groups">${[...new Set([...habits.map(groupOf).filter(Boolean), ...AREAS])].sort().map(g => `<option value="${esc(g)}">`).join('')}</datalist>` : ''}
    <label for="f-desc">Description</label><textarea id="f-desc" name="description" rows="2">${esc(h?.description)}</textarea>
  </form>`;
}

function bindForm(h) {
  const f = $('habit-form'), sync = () => { const n = f.type.value === 'numerical'; $('f-numeric').hidden = !n; $('f-numhint').hidden = !n; };
  f.type.addEventListener('change', sync);
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const [num, den] = f.freq.value.split('/').map(Number);
    const row = {
      id: h ? h.id : crypto.randomUUID(), name: f.name.value.trim(), question: f.question.value.trim(),
      description: f.description.value.trim(), type: f.type.value, freq_num: num, freq_den: den,
      target_type: f.target_type.value, target_value: parseFloat(f.target_value.value) || 0, unit: f.unit.value.trim(),
      color: f.color.value, position: h ? h.position : habits.reduce((m, x) => Math.max(m, x.position), 0) + 1,
      archived: h ? h.archived : false,
    };
    if (f.group_name) row.group_name = f.group_name.value.trim().toLowerCase();
    if (!row.name) return;
    const btn = document.querySelector('button[form=habit-form]'); btn.disabled = true;
    if (await saveHabit(row)) location.hash = `#/habit/${row.id}`;
    else btn.disabled = false;
  });
}

async function toggleArchive(id) {
  const h = habits.find(x => x.id === id);
  if (await saveHabit({...h, archived: !h.archived})) { toast(h.archived ? 'Unarchived' : 'Archived'); location.hash = '#/'; render(); }
}

async function deleteHabit(id) {
  const h = habits.find(x => x.id === id);
  if (!confirm(`Delete ${h.name} and all its history? This can't be undone.`)) return;
  const {error} = await sb.from('habits').delete().eq('id', id);
  if (error) return fail(error, 'Delete');
  habits = habits.filter(x => x.id !== id); entries.delete(id); statsCache.delete(id);
  location.hash = '#/'; render();
}

// ------------------------------------------------------------------ logging: tap, long-press, dialogs
/* Tap a yes/no cell to toggle ✓/✗; long-press (or right-click) for notes and skip.
   Measurable cells open the small number popup either way. Calendar days open the dialog. */

const dlg = $('day-dialog'), choices = dlg.querySelectorAll('[data-v]');
choices.forEach(b => { b.innerHTML = ICON[{yes: 'check', no: 'close', skip: 'skip'}[b.dataset.v]]; });
let dlgHabit = null, dlgDay = null, dlgStatus = '';
const pick = v => { dlgStatus = v; choices.forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); };
// Pressing the selected choice again clears it (back to "not logged").
choices.forEach(b => b.addEventListener('click', () => pick(dlgStatus === b.dataset.v ? '' : b.dataset.v)));
const longDate = day => new Date(day * 86400000).toLocaleDateString(undefined, {weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC'});

function act(el, long) {
  const h = habits.find(x => x.id === el.dataset.habit), day = +el.dataset.day;
  if (!h) return;
  if (E.isNumerical(h)) return openNum(h, day, el);
  if (long || el.dataset.act !== 'toggle') return openDay(h, day, el);
  const logged = entries.get(h.id).get(day);
  setEntry(h, day, logged && logged.value === V.YES_MANUAL ? V.NO : V.YES_MANUAL, logged ? logged.notes : '');
  if (navigator.vibrate) navigator.vibrate(8);
}

function openDay(h, day, el) {
  dlgHabit = h; dlgDay = day;
  const logged = entries.get(h.id).get(day);
  dlg.style.setProperty('--hc', hc(h));
  $('day-habit').textContent = h.name;
  $('day-date').textContent = longDate(day);
  pick(el.dataset.raw);
  $('day-notes').value = logged ? logged.notes : '';
  dlg.returnValue = '';
  dlg.showModal();
}

const pop = $('num-pop');
function openNum(h, day, el) {
  dlgHabit = h; dlgDay = day;
  const logged = entries.get(h.id).get(day), r = el.getBoundingClientRect();
  $('np-notes').value = logged ? logged.notes : '';
  $('np-value').value = el.dataset.raw || '';
  $('np-unit').textContent = [h.unit, longDate(day)].filter(Boolean).join(' · ');
  pop.style.top = `${Math.max(12, Math.min(r.top - 70, window.innerHeight * 0.3))}px`;
  pop.returnValue = '';
  pop.showModal();
  $('np-value').focus(); $('np-value').select();
}

let pressTimer = null, pressed = false, pressAt = null;
const app = $('app'), cellOf = e => e.target.closest('.day[role=button]');
app.addEventListener('pointerdown', e => {
  const el = cellOf(e); if (!el) return;
  pressed = false; pressAt = [e.clientX, e.clientY]; clearTimeout(pressTimer);
  pressTimer = setTimeout(() => { pressed = true; act(el, true); }, 450);
});
app.addEventListener('pointermove', e => { if (pressAt && Math.hypot(e.clientX - pressAt[0], e.clientY - pressAt[1]) > 10) clearTimeout(pressTimer); });
['pointerup', 'pointercancel'].forEach(t => app.addEventListener(t, () => { clearTimeout(pressTimer); pressAt = null; }));
app.addEventListener('contextmenu', e => {
  const el = cellOf(e); if (!el) return;
  e.preventDefault(); clearTimeout(pressTimer);
  if (!pressed) { pressed = true; act(el, true); }
});
app.addEventListener('click', e => {
  const el = cellOf(e); if (!el) return;
  if (pressed) { pressed = false; return; }   // the long-press already handled it
  act(el, false);
});
app.addEventListener('keydown', e => {
  const el = cellOf(e);
  if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); act(el, e.shiftKey); }
});

// A tap on the backdrop closes any dialog.
document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));
$('day-cancel').addEventListener('click', () => dlg.close());
$('day-notes').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) dlg.querySelector('[value=save]').click(); });
dlg.addEventListener('close', () => {
  if (dlg.returnValue !== 'save') return;
  setEntry(dlgHabit, dlgDay, {yes: V.YES_MANUAL, no: V.NO, skip: V.SKIP, '': V.UNKNOWN}[dlgStatus], $('day-notes').value.trim());
});
$('np-notes').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) pop.querySelector('[value=save]').click(); });
pop.addEventListener('close', () => {
  if (pop.returnValue !== 'save') return;
  const raw = $('np-value').value.trim(), value = raw === '' ? V.UNKNOWN : Math.round(parseFloat(raw) * 1000);
  if (Number.isNaN(value)) return toast('Not a number');
  setEntry(dlgHabit, dlgDay, value, $('np-notes').value.trim());
});

// ------------------------------------------------------------------ menu: import / export

function openMenu() { $('menu-who').textContent = user ? `Signed in as ${user.email}` : ''; $('menu-dialog').showModal(); }
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const stamp = () => E.toIso(today());

$('menu-export').addEventListener('click', () => {
  const out = {format: 'habitkit-backup', version: 1, exported_at: stamp(), habits: habits.map(h => ({
    uuid: h.id, name: h.name, question: h.question, description: h.description, type: h.type, freq_num: h.freq_num,
    freq_den: h.freq_den, target_type: h.target_type, target_value: h.target_value, unit: h.unit, color: h.color,
    position: h.position, archived: h.archived, reminder_time: h.reminder_time, reminder_days: h.reminder_days, group_name: groupOf(h),
    entries: [...entries.get(h.id)].sort((a, b) => a[0] - b[0]).map(([d, e]) => ({date: E.toIso(d), value: e.value, notes: e.notes})),
  }))};
  download(`habits-${stamp()}.json`, JSON.stringify(out, null, 1), 'application/json');
});

$('menu-csv').addEventListener('click', () => {
  const q = s => /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  const lines = ['habit,date,value,notes'];
  for (const h of habits) for (const [d, e] of [...entries.get(h.id)].sort((a, b) => a[0] - b[0])) {
    const v = E.isNumerical(h) ? fmtRaw(e.value) : ({[-1]: 'unknown', 0: 'no', 1: 'yes_auto', 2: 'yes_manual', 3: 'skip'}[e.value]);
    lines.push([h.name, E.toIso(d), v, e.notes].map(x => q(String(x))).join(','));
  }
  download(`habits-${stamp()}.csv`, lines.join('\n') + '\n', 'text/csv');
});

$('menu-import').addEventListener('click', () => $('import-file').click());
$('menu-signout').addEventListener('click', () => { $('menu-dialog').close(); sb.auth.signOut(); });

/* habitkit's uuids are 32 hex chars; Postgres wants the dashed form for a stable id across re-imports. */
const asUuid = s => /^[0-9a-f]{32}$/i.test(s) ? s.replace(/(.{8})(.{4})(.{4})(.{4})(.{12})/, '$1-$2-$3-$4-$5').toLowerCase()
                   : /^[0-9a-f-]{36}$/i.test(s || '') ? s.toLowerCase() : crypto.randomUUID();

$('import-file').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch { return toast('Not a JSON file'); }
  if (data.format !== 'habitkit-backup' || !Array.isArray(data.habits)) return toast('Not a habitkit backup');
  const n = data.habits.reduce((s, h) => s + (h.entries || []).length, 0);
  if (!confirm(`Import ${data.habits.length} habits and ${n} entries? Habits already here (same id) are updated, not duplicated.`)) return;
  $('menu-dialog').close();
  toast('Importing…');
  const hrows = data.habits.map((h, i) => ({
    id: asUuid(h.uuid), name: h.name, question: h.question || '', description: h.description || '',
    type: h.type === 'numerical' ? 'numerical' : 'yes_no', freq_num: h.freq_num || 1, freq_den: h.freq_den || 1,
    target_type: h.target_type === 'at_most' ? 'at_most' : 'at_least', target_value: +h.target_value || 0, unit: h.unit || '',
    color: h.color || COLORS[i % COLORS.length], position: h.position ?? i + 1, archived: !!h.archived,
    reminder_time: h.reminder_time || null, reminder_days: h.reminder_days ?? 127,
    ...(hasGroups() ? {group_name: (h.group_name || '').trim().toLowerCase()} : {}),
  }));
  let {error} = await sb.from('habits').upsert(hrows);
  if (error) return fail(error, 'Import');
  const erows = data.habits.flatMap((h, i) => (h.entries || []).map(x => ({habit_id: hrows[i].id, date: x.date, value: x.value, notes: x.notes || ''})));
  for (let i = 0; i < erows.length; i += 500) {
    ({error} = await sb.from('habit_entries').upsert(erows.slice(i, i + 500), {onConflict: 'habit_id,date'}));
    if (error) return fail(error, `Import (after ${i} entries)`);
  }
  await loadAll(); render();
  toast(`Imported ${hrows.length} habits, ${erows.length} entries`);
});

// ------------------------------------------------------------------ auth + boot

function viewAuth() {
  $('app').innerHTML = `<div class="auth"><div class="card">
    <h1>Habits</h1><p class="muted">Sign in with your email; we'll send a magic link.</p>
    <form id="auth-form"><input id="auth-email" type="email" placeholder="you@example.com" autocomplete="email" required>
    <button class="btn primary" id="auth-send">Send magic link</button></form>
    <div class="auth-status" id="auth-status"></div></div></div>`;
  $('auth-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('auth-send'); btn.disabled = true; btn.textContent = 'Sending…';
    const {error} = await sb.auth.signInWithOtp({email: $('auth-email').value.trim(), options: {emailRedirectTo: location.href.split('#')[0]}});
    btn.disabled = false; btn.textContent = 'Send magic link';
    $('auth-status').textContent = error ? 'Error: ' + error.message : 'Check your email for the sign-in link ✓';
  });
}

async function onSignedIn(session) {
  const first = !user;
  user = session.user;
  try { await Promise.all([loadAll(), first ? loadJournal().then(restoreDraft) : loadJournal().then(renderJournal)]); }
  catch (e) {
    const missing = /habit/.test(e.message || '') && /(does not exist|schema cache)/.test(e.message || '');
    $('app').innerHTML = `<div class="card"><b>Couldn't load habits.</b><p class="muted" style="margin-top:6px">${missing
      ? 'The database tables are missing: run <code>habits/supabase/schema.sql</code> in the Supabase SQL editor.' : esc(e.message)}</p></div>`;
    return console.error(e);
  }
  if (first || !document.querySelector('dialog[open]')) render();
}

window.addEventListener('hashchange', render);
// Data loaded yesterday shows the wrong "today" after midnight; refresh when the tab comes back.
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !user) return;
  if (!loadDraft().date) jDate.value = E.toIso(today());   // an un-backdated composer follows the calendar
  statsCache.clear(); render();
  loadJournal().then(renderJournal);   // picks up "in vault" after a pull
});

(async function boot() {
  const {data: {session}} = await sb.auth.getSession();
  sb.auth.onAuthStateChange((event, s) => {
    if (event === 'SIGNED_IN' && s && (!user || user.id !== s.user.id)) onSignedIn(s);
    if (event === 'SIGNED_OUT') { user = null; habits = []; entries = new Map(); statsCache.clear(); viewAuth(); }
  });
  if (session) await onSignedIn(session); else viewAuth();
})();
</script>
</body>
</html>
